[package]
name = "codediff"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "7.0.0"
git2 = "0.21.0"
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
slint = "1.18.1"
syntect = "5.3.0"
thiserror = "2.0.21"
two-face = "0.5.2"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
# Software renderer for examples/screenshot.rs (offscreen UI captures).
slint = { version = "1.18.1", features = ["renderer-software"] }
tempfile = "3.27.0"

[lib]
path = "src/lib.rs"

[package.metadata.bundle]
name = "CodeDiff"
identifier = "com.codediff.app"
icon = ["assets/icon.png"]
osx_minimum_system_version = "12.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
